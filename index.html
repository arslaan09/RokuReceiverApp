<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDcast Receiver</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #03050c;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Video ── */
    #video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    #video.visible { opacity: 1; }

    /* ── Ambient Background Glows ── */
    .ambient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #060913;
    }
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      mix-blend-mode: screen;
      animation: float 20s infinite alternate ease-in-out;
    }
    .blob1 {
      top: -10%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
    }
    .blob2 {
      bottom: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      animation-delay: -5s;
    }
    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8%, 5%) scale(1.15); }
    }

    /* ── Modern Status Card Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #overlay.hidden { opacity: 0; }

    .glass-card {
      background: rgba(10, 15, 30, 0.45);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 48px 64px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      max-width: 90%;
      width: 540px;
      text-align: center;
    }

    /* ── Logo Ring with Glowing Indicators ── */
    .logo-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.5s ease;
    }
    .logo-ring svg { 
      width: 44px; height: 44px; 
      stroke: rgba(255, 255, 255, 0.7); 
      transition: all 0.5s ease;
    }

    /* Spinning/pulsing animation ring */
    .logo-ring::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #3b82f6;
      animation: spin 1.8s linear infinite;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
      transition: all 0.5s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Connected state updates */
    .logo-ring.connected {
      border-color: rgba(34, 197, 94, 0.2);
      background: rgba(34, 197, 94, 0.05);
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.25);
    }
    .logo-ring.connected svg {
      stroke: #22c55e;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.5));
    }
    .logo-ring.connected::before { 
      border-top-color: #22c55e; 
      animation: pulse-ring 2s infinite ease-in-out;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%      { transform: scale(1.04); opacity: 1; }
    }

    /* ── Typography ── */
    #status-title {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    #status-sub {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
    }

  </style>
</head>
<body>

  <!-- Ambient Glowing Blobs -->
  <div class="ambient-bg">
    <div class="glow-blob blob1"></div>
    <div class="glow-blob blob2"></div>
  </div>

  <!-- No 'muted': Cast Web Receiver allows unmuted autoplay; iOS sender controls audio track isEnabled -->
  <video id="video" autoplay playsinline></video>

  <div id="overlay">
    <div class="glass-card">
      <div class="logo-ring" id="logo-ring">
        <!-- Cast / TV icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
          <path d="M2 10h20"/>
        </svg>
      </div>
      <div>
        <div id="status-title">Waiting for BDcast…</div>
        <div id="status-sub">Open BDcast on your iPhone and connect to this TV</div>
      </div>
    </div>
  </div>

  <!-- Google Cast Web Receiver SDK (CAF v3) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    'use strict';

    // ── DOM refs ──────────────────────────────────────────────────────────
    const video       = document.getElementById('video');
    const overlay     = document.getElementById('overlay');
    const logoRing    = document.getElementById('logo-ring');
    const statusTitle = document.getElementById('status-title');
    const statusSub   = document.getElementById('status-sub');

    // ── State ─────────────────────────────────────────────────────────────
    const NS = 'urn:x-cast:com.bdcast.webrtc';
    let pc              = null;
    let senderId        = null;
    let remoteDescSet   = false;       // true once setRemoteDescription completes
    let pendingCandidates = [];        // ICE candidates buffered before remote desc
    let serverBaseUrl   = '';
    let signalingTimeout = null;

    // ── UI helpers ────────────────────────────────────────────────────────
    function setStatus(title, sub) {
      statusTitle.textContent = title;
      statusSub.textContent   = sub || '';
    }

    function showStream(on) {
      video.classList.toggle('visible', on);
      overlay.style.display = on ? 'none' : 'flex';
      const ambient = document.querySelector('.ambient-bg');
      if (ambient) {
        ambient.style.display = on ? 'none' : 'block';
      }
    }

    function setConnected(on) {
      logoRing.classList.toggle('connected', on);
    }

    // ── Cast Receiver setup ───────────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NS, async (event) => {
      senderId = event.senderId;

      // event.data is a raw JSON string when the iOS sender uses sendTextMessage()
      let msg;
      try {
        msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch (e) {
        console.error('[BDcast] Failed to parse message:', event.data, e);
        return;
      }

      console.log('[BDcast] received:', msg.type);

      switch (msg.type) {
        case 'connect':
          console.log('[BDcast] Received connect message with URL:', msg.url);
          serverBaseUrl = msg.url;
          cleanup(null, null, true);
          if (signalingTimeout) { clearTimeout(signalingTimeout); signalingTimeout = null; }
          startHTTPSignaling();
          break;
        case 'offer': await handleOffer(msg.sdp);  break;
        case 'ice':   await handleICE(msg);         break;
        case 'stop':
          cleanup('Connected', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
          setConnected(true);
          break;
        default:
          console.warn('[BDcast] unknown message type:', msg.type);
      }
    });

    context.addEventListener(
      cast.framework.system.EventType.SENDER_CONNECTED,
      () => {
        setConnected(true);
        setStatus('Connected', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
      }
    );

    context.addEventListener(
      cast.framework.system.EventType.SENDER_DISCONNECTED,
      () => {
        setConnected(false);
        cleanup('Disconnected', 'Please connect from your iOS device');
      }
    );

    context.start({
      touchScreenOptimizedApp: false,
      maxInactivity: 3600        // keep alive for up to 1 h of sender inactivity
    });

    // ── WebRTC ────────────────────────────────────────────────────────────
    function buildPeerConnection() {
      const cfg = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302'  },
          { urls: 'stun:stun1.l.google.com:19302' },
        ]
      };
      const conn = new RTCPeerConnection(cfg);

      conn.ontrack = (event) => {
        if (event.receiver) {
          event.receiver.playoutDelayHint = 0;
        }
        let stream = event.streams[0];
        if (!stream && event.track) {
          stream = new MediaStream([event.track]);
        }
        if (!stream) return;
        if (video.srcObject !== stream) {
          video.srcObject = stream;
          video.volume = 1;
          video.play().catch(e => console.warn('[BDcast] play():', e));
        }
        showStream(true);
        setStatus('Mirroring active');
      };

      conn.onicecandidate = ({ candidate }) => {
        if (!candidate || !senderId) return;
        context.sendCustomMessage(NS, senderId, {
          type:          'ice',
          sdpMid:        candidate.sdpMid,
          sdpMLineIndex: candidate.sdpMLineIndex,
          candidate:     candidate.candidate,
        });
      };

      conn.oniceconnectionstatechange = () => {
        console.log('[WebRTC] ICE state:', conn.iceConnectionState);
        switch (conn.iceConnectionState) {
          case 'connected':
          case 'completed':
            setStatus('Stream connected', 'Receiving screen');
            break;
          case 'disconnected':
            setStatus('Connecting…', 'Network connection weak, trying to reconnect');
            break;
          case 'failed':
            setTimeout(() => {
              if (conn && conn.iceConnectionState === 'failed') {
                cleanup('Connection lost', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
                setConnected(true);
              }
            }, 10000); // 10 second grace period to allow automatic ice restart
            break;
          case 'closed':
            cleanup('Disconnected', 'Please connect from your iOS device');
            break;
        }
      };

      return conn;
    }

    async function startHTTPSignaling() {
      console.log('[BDcast] starting HTTP signaling with base:', serverBaseUrl);
      setStatus('Connecting…', 'Establishing WebRTC session');
      setConnected(true);
      
      try {
        const resOffer = await fetch(serverBaseUrl + '/signaling/offer');
        if (!resOffer.ok) throw new Error('Failed to fetch offer');
        const offerData = await resOffer.json();
        
        cleanup(null, null, true);
        pc = buildPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: offerData.sdp });
        remoteDescSet = true;
        
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        
        const resAnswer = await fetch(serverBaseUrl + '/signaling/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: pc.localDescription.sdp })
        });
        if (!resAnswer.ok) throw new Error('Failed to send answer');
        
        pollCandidates();
      } catch (err) {
        console.error('[BDcast] HTTP signaling error:', err);
        signalingTimeout = setTimeout(startHTTPSignaling, 2000); // retry
      }
    }

    async function pollCandidates() {
      if (!pc || !remoteDescSet) return;
      try {
        const res = await fetch(serverBaseUrl + '/signaling/ice-candidates');
        if (res.ok) {
          const candidates = await res.json();
          for (const c of candidates) {
            try {
              await pc.addIceCandidate({
                candidate:     c.candidate,
                sdpMid:        c.sdpMid,
                sdpMLineIndex: c.sdpMLineIndex
              });
            } catch (e) { console.warn('[ICE]', e); }
          }
        }
      } catch (err) {
        console.warn('[BDcast] error polling candidates:', err);
      }
      setTimeout(pollCandidates, 1000);
    }

    function cleanup(title, sub, keepOverlay = false) {
      if (pc) { pc.close(); pc = null; }
      remoteDescSet    = false;
      pendingCandidates = [];
      video.srcObject  = null;
      if (!keepOverlay) {
        showStream(false);
        setConnected(false);
      }
      if (title !== null) setStatus(title, sub);
    }

    // Smooth orientation resize transition
    video.addEventListener('resize', () => {
      console.log('[BDcast] Video resized to:', video.videoWidth, 'x', video.videoHeight);
      
      // Temporarily scale down and fade slightly
      video.style.transition = 'none';
      video.style.transform = 'scale(0.92)';
      video.style.opacity = '0.7';
      
      // Force layout recalculation
      void video.offsetHeight;
      
      // Animate back to full size and opacity smoothly
      video.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
      video.style.transform = 'scale(1)';
      video.style.opacity = '1';
    });

    // Start signaling automatically on load
    window.addEventListener('DOMContentLoaded', () => {
      startHTTPSignaling();
    });
  </script>
</body>
</html>
