<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BDcast Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: contain; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff; font: 16px/1 sans-serif;
      padding: 8px 20px; border-radius: 20px; pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Connected. Ready to mirror.</div>

  <!-- Google Cast Receiver SDK (CAF v3) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    'use strict';

    const NS    = 'urn:x-cast:com.bdcast.webrtc';
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    let pc = null;
    let senderId = null;

    // ── Cast Receiver setup ─────────────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NS, async (event) => {
      senderId = event.senderId;
      const msg = event.data;

      switch (msg.type) {
        case 'offer':  await handleOffer(msg.sdp);  break;
        case 'ice':    await handleRemoteICE(msg);  break;
        case 'stop':   
          cleanup();
          setStatus('Connected. Ready to mirror.');
          break;
      }
    });

    context.addEventListener(
      cast.framework.system.EventType.SENDER_CONNECTED,
      () => {
        setStatus('Connected. Ready to mirror.');
      }
    );

    context.addEventListener(
      cast.framework.system.EventType.SENDER_DISCONNECTED,
      () => {
        cleanup();
        setStatus('Disconnected');
      }
    );

    context.start({
      touchScreenOptimizedApp: false,
      maxInactivity: 0          // keep alive as long as sender is connected
    });

    // ── WebRTC ──────────────────────────────────────────────────────────────

    function createPC() {
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };
      const p = new RTCPeerConnection(config);

      p.ontrack = (e) => {
        setStatus('Receiving stream…');
        let stream = e.streams[0];
        if (!stream && e.track) {
          stream = new MediaStream([e.track]);
        }
        if (!stream) return;
        if (video.srcObject !== stream) {
          video.srcObject = stream;
        }
      };

      p.onicecandidate = (e) => {
        if (!e.candidate || !senderId) return;
        context.sendCustomMessage(NS, senderId, {
          type:         'ice',
          sdpMid:       e.candidate.sdpMid,
          sdpMLineIndex: e.candidate.sdpMLineIndex,
          candidate:    e.candidate.candidate
        });
      };

      p.oniceconnectionstatechange = () => {
        setStatus('ICE: ' + p.iceConnectionState);
        if (p.iceConnectionState === 'failed' || p.iceConnectionState === 'disconnected') {
          cleanup();
          setStatus('Connected. Ready to mirror.');
        }
      };

      return p;
    }

    async function handleOffer(sdpStr) {
      cleanup();
      pc = createPC();
      setStatus('Connecting…');

      await pc.setRemoteDescription({ type: 'offer', sdp: sdpStr });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      context.sendCustomMessage(NS, senderId, {
        type: 'answer',
        sdp:  pc.localDescription.sdp
      });
    }

    async function handleRemoteICE(msg) {
      if (!pc) return;
      try {
        await pc.addIceCandidate({
          candidate:    msg.candidate,
          sdpMid:       msg.sdpMid,
          sdpMLineIndex: msg.sdpMLineIndex
        });
      } catch (e) { console.warn('[ICE]', e); }
    }

    function cleanup() {
      if (pc) { pc.close(); pc = null; }
      video.srcObject = null;
    }

    function setStatus(text) {
      status.textContent = text;
    }
  </script>
</body>
</html>
