<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BDcast Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: contain; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff; font: 16px/1 sans-serif;
      padding: 8px 20px; border-radius: 20px; pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Connected. Ready to mirror.</div>

  <!-- Google Cast Receiver SDK (CAF v3) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    'use strict';

    const NS    = 'urn:x-cast:com.bdcast.webrtc';
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    let pc = null;
    let senderId = null;

    // ── Cast Receiver setup ─────────────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NS, async (event) => {
      senderId = event.senderId;
      const msg = event.data;

      switch (msg.type) {
        case 'offer':  await handleOffer(msg.sdp);  break;
        case 'ice':    await handleRemoteICE(msg);  break;
        case 'stop':   
          cleanup();
          setStatus('Connected. Ready to mirror.');
          break;
      }
    });

    context.addEventListener(
      cast.framework.system.EventType.SENDER_CONNECTED,
      () => {
        setStatus('Connected. Ready to mirror.');
      }
    );

    context.addEventListener(
      cast.framework.system.EventType.SENDER_DISCONNECTED,
      () => {
        cleanup();
        setStatus('Disconnected');
      }
    );

    context.start({
      touchScreenOptimizedApp: false,
      maxInactivity: 0          // keep alive as long as sender is connected
    });

    // ── WebRTC & HTTP Signaling ──────────────────────────────────────────────

    let remoteDescSet = false;

    function createPC() {
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };
      const p = new RTCPeerConnection(config);

      p.ontrack = (e) => {
        setStatus('Receiving stream…');
        if (e.receiver) {
          e.receiver.playoutDelayHint = 0;
        }
        let stream = e.streams[0];
        if (!stream && e.track) {
          stream = new MediaStream([e.track]);
        }
        if (!stream) return;
        if (video.srcObject !== stream) {
          video.srcObject = stream;
        }
      };

      p.onicecandidate = (e) => {
        if (!e.candidate) return;
        fetch('/signaling/ice-candidate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            candidate:     e.candidate.candidate,
            sdpMid:        e.candidate.sdpMid,
            sdpMLineIndex: e.candidate.sdpMLineIndex
          })
        }).catch(err => console.warn('[BDcast] POST candidate error:', err));
      };

      p.oniceconnectionstatechange = () => {
        setStatus('ICE: ' + p.iceConnectionState);
        if (p.iceConnectionState === 'failed') {
          setTimeout(() => {
            if (p && p.iceConnectionState === 'failed') {
              cleanup();
              setStatus('Connected. Ready to mirror.');
              startHTTPSignaling();
            }
          }, 10000); // 10 second recovery grace period
        } else if (p.iceConnectionState === 'disconnected') {
          setStatus('ICE: disconnected (retrying...)');
        }
      };

      return p;
    }

    async function startHTTPSignaling() {
      console.log('[BDcast] starting HTTP signaling...');
      setStatus('Connecting…');
      
      try {
        const resOffer = await fetch('/signaling/offer');
        if (!resOffer.ok) throw new Error('Failed to fetch offer');
        const offerData = await resOffer.json();
        
        cleanup();
        pc = createPC();
        await pc.setRemoteDescription({ type: 'offer', sdp: offerData.sdp });
        remoteDescSet = true;
        
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        
        const resAnswer = await fetch('/signaling/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: pc.localDescription.sdp })
        });
        if (!resAnswer.ok) throw new Error('Failed to send answer');
        
        pollCandidates();
      } catch (err) {
        console.error('[BDcast] HTTP signaling error:', err);
        setTimeout(startHTTPSignaling, 2000); // retry
      }
    }

    async function pollCandidates() {
      if (!pc || !remoteDescSet) return;
      try {
        const res = await fetch('/signaling/ice-candidates');
        if (res.ok) {
          const candidates = await res.json();
          for (const c of candidates) {
            try {
              await pc.addIceCandidate({
                candidate:     c.candidate,
                sdpMid:        c.sdpMid,
                sdpMLineIndex: c.sdpMLineIndex
              });
            } catch (e) { console.warn('[ICE]', e); }
          }
        }
      } catch (err) {
        console.warn('[BDcast] error polling candidates:', err);
      }
      setTimeout(pollCandidates, 1000);
    }

    function cleanup() {
      if (pc) { pc.close(); pc = null; }
      remoteDescSet = false;
      video.srcObject = null;
    }

    function setStatus(text) {
      status.textContent = text;
    }

    // Start signaling automatically on load
    window.addEventListener('DOMContentLoaded', () => {
      startHTTPSignaling();
    });
  </script>
</body>
</html>
