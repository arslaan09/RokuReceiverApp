<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Cast Receiver</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #03050c;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── WebRTC mirror video ── */
    #video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    #video.visible { opacity: 1; }

    /* ── Standard Cast Media Player ── */
    cast-media-player {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: none;
    }

    /* ── Ambient Background Glows ── */
    .ambient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #060913;
    }
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      mix-blend-mode: screen;
      animation: float 20s infinite alternate ease-in-out;
    }
    .blob1 {
      top: -10%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
    }
    .blob2 {
      bottom: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      animation-delay: -5s;
    }
    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8%, 5%) scale(1.15); }
    }

    /* ── Modern Status Card Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #overlay.hidden { opacity: 0; }

    .glass-card {
      background: rgba(10, 15, 30, 0.45);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 48px 64px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      max-width: 90%;
      width: 540px;
      text-align: center;
    }

    /* ── Logo Ring with Glowing Indicators ── */
    .logo-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.5s ease;
    }
    .logo-ring svg {
      width: 44px; height: 44px;
      stroke: rgba(255, 255, 255, 0.7);
      transition: all 0.5s ease;
    }

    .logo-ring::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #3b82f6;
      animation: spin 1.8s linear infinite;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
      transition: all 0.5s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-ring.connected {
      border-color: rgba(34, 197, 94, 0.2);
      background: rgba(34, 197, 94, 0.05);
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.25);
    }
    .logo-ring.connected svg {
      stroke: #22c55e;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.5));
    }
    .logo-ring.connected::before {
      border-top-color: #22c55e;
      animation: pulse-ring 2s infinite ease-in-out;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%      { transform: scale(1.04); opacity: 1; }
    }

    /* ── Typography ── */
    #status-title {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    #status-sub {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Blobs -->
  <div class="ambient-bg">
    <div class="glow-blob blob1"></div>
    <div class="glow-blob blob2"></div>
  </div>

  <!-- Start muted to ensure Chromium autoplay succeeds; iOS controls audio via track.isEnabled -->
  <video id="video" autoplay playsinline muted></video>

  <!-- Standard Cast Media Player -->
  <cast-media-player></cast-media-player>

  <div id="overlay">
    <div class="glass-card">
      <div class="logo-ring" id="logo-ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
          <path d="M2 10h20"/>
        </svg>
      </div>
      <div>
        <div id="status-title">Screen Mirroring</div>
        <div id="status-sub">Open the app on your iPhone to connect and start mirroring or casting</div>
      </div>
    </div>
  </div>

  <!-- Google Cast Web Receiver SDK (CAF v3) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    'use strict';

    // ── DOM refs ──────────────────────────────────────────────────────────
    const video       = document.getElementById('video');
    const overlay     = document.getElementById('overlay');
    const logoRing    = document.getElementById('logo-ring');
    const statusTitle = document.getElementById('status-title');
    const statusSub   = document.getElementById('status-sub');

    // ── State ─────────────────────────────────────────────────────────────
    const NS = 'urn:x-cast:com.bdcast.webrtc';
    let pc               = null;
    let senderId         = null;
    let remoteDescSet    = false;
    let pendingCandidates = [];

    // ── UI helpers ────────────────────────────────────────────────────────
    function setStatus(title, sub) {
      statusTitle.textContent = title;
      statusSub.textContent   = sub || '';
    }

    function showStream(on) {
      video.classList.toggle('visible', on);
      overlay.style.display = on ? 'none' : 'flex';
      const ambient = document.querySelector('.ambient-bg');
      if (ambient) ambient.style.display = on ? 'none' : 'block';
    }

    function setConnected(on) {
      logoRing.classList.toggle('connected', on);
    }

    // Adapt object-fit to stream orientation.
    // Use both the resize event AND a 300 ms poll — Cast Web Receiver's Chromium
    // does not always fire resize reliably when WebRTC changes frame dimensions.
    function updateObjectFit() {
      if (!video.videoWidth || !video.videoHeight) return;
      const shouldCover = video.videoWidth > video.videoHeight;
      const isCover     = video.style.objectFit === 'cover';
      if (shouldCover !== isCover) {
        video.style.objectFit = shouldCover ? 'cover' : 'contain';
      }
    }
    video.addEventListener('resize', updateObjectFit);
    setInterval(updateObjectFit, 300);

    // ── Cast Receiver setup ───────────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();

    // ── Standard Cast Media Player Listener ────────────────────────────────
    const playerManager = context.getPlayerManager();

    function updateUIForMediaState() {
      const player = document.querySelector('cast-media-player');
      if (!player) return;

      const mediaInfo = playerManager.getMediaInformation();
      const playerState = playerManager.getPlayerState();

      const hasMedia = !!(mediaInfo && mediaInfo.contentId);
      const isImage = !!(mediaInfo && mediaInfo.contentType && mediaInfo.contentType.startsWith('image/'));
      const isIdle = playerState === cast.framework.messages.PlayerState.IDLE;

      // Determine if media player should be active
      let isMediaActive = false;
      if (hasMedia) {
        if (isImage) {
          isMediaActive = true;
        } else {
          isMediaActive = !isIdle;
        }
      }

      console.log('[BDcast] updateUI: hasMedia=', hasMedia, 'isImage=', isImage, 'playerState=', playerState, 'isMediaActive=', isMediaActive);

      if (isMediaActive) {
        // Show media player and hide mirroring elements
        player.style.display = 'block';
        video.classList.remove('visible');
        video.style.display = 'none';
        overlay.style.display = 'none';
        const ambient = document.querySelector('.ambient-bg');
        if (ambient) ambient.style.display = 'none';
      } else {
        // Hide media player and restore mirroring/idle elements
        player.style.display = 'none';
        const isMirroringActive = !!(video.srcObject);
        video.style.display = 'block';
        video.classList.toggle('visible', isMirroringActive);
        overlay.style.display = isMirroringActive ? 'none' : 'flex';
        const ambient = document.querySelector('.ambient-bg');
        if (ambient) ambient.style.display = isMirroringActive ? 'none' : 'block';
      }
    }

    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_STATE_CHANGED,
      (event) => {
        console.log('[BDcast] PLAYER_STATE_CHANGED:', event.value);
        updateUIForMediaState();
      }
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_STATUS,
      () => {
        console.log('[BDcast] MEDIA_STATUS updated');
        updateUIForMediaState();
      }
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.REQUEST_LOAD,
      (event) => {
        console.log('[BDcast] REQUEST_LOAD received, cleaning up WebRTC screen mirroring');
        if (pc) {
          pc.close();
          pc = null;
        }
        remoteDescSet = false;
        pendingCandidates = [];
        video.srcObject = null;
      }
    );

    context.addCustomMessageListener(NS, async (event) => {
      senderId = event.senderId;

      let msg;
      try {
        msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch (e) {
        console.error('[BDcast] Failed to parse message:', event.data, e);
        return;
      }

      console.log('[BDcast] received:', msg.type);

      switch (msg.type) {
        case 'offer': await handleOffer(msg.sdp);  break;
        case 'ice':   await handleICE(msg);         break;
        case 'stop':
          cleanup('Connected', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
          setConnected(true);
          break;
        default:
          console.warn('[BDcast] unknown message type:', msg.type);
      }
    });

    context.addEventListener(
      cast.framework.system.EventType.SENDER_CONNECTED,
      () => {
        setConnected(true);
        setStatus('Connected', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
      }
    );

    context.addEventListener(
      cast.framework.system.EventType.SENDER_DISCONNECTED,
      () => {
        setConnected(false);
        cleanup('Disconnected', 'Please connect from your iOS device');
      }
    );

    context.start({
      touchScreenOptimizedApp: false,
      maxInactivity: 3600
    });

    // ── WebRTC ────────────────────────────────────────────────────────────
    function buildPeerConnection() {
      const cfg = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302'  },
          { urls: 'stun:stun1.l.google.com:19302' },
        ]
      };
      const conn = new RTCPeerConnection(cfg);

      conn.ontrack = (event) => {
        if (event.receiver) event.receiver.playoutDelayHint = 0;
        let stream = event.streams[0];
        if (!stream && event.track) stream = new MediaStream([event.track]);
        if (!stream) return;
        if (video.srcObject !== stream) {
          video.srcObject = stream;
          video.volume = 1;
          video.play().catch(e => {
            console.warn('[BDcast] play() failed, retrying muted:', e);
            video.muted = true;
            video.play().catch(e2 => console.error('[BDcast] play(muted) failed:', e2));
          });
        }
        showStream(true);
        setStatus('Mirroring active');
      };

      conn.onicecandidate = ({ candidate }) => {
        if (!candidate || !senderId) return;
        context.sendCustomMessage(NS, senderId, {
          type:          'ice',
          sdpMid:        candidate.sdpMid,
          sdpMLineIndex: candidate.sdpMLineIndex,
          candidate:     candidate.candidate,
        });
      };

      conn.oniceconnectionstatechange = () => {
        console.log('[WebRTC] ICE state:', conn.iceConnectionState);
        switch (conn.iceConnectionState) {
          case 'connected':
          case 'completed':
            setStatus('Stream connected', 'Receiving screen');
            break;
          case 'disconnected':
            setStatus('Connecting…', 'Network connection weak, trying to reconnect');
            break;
          case 'failed':
            setTimeout(() => {
              if (conn && conn.iceConnectionState === 'failed') {
                cleanup('Connection lost', 'Ready to mirror. Tap "Start Mirroring" on your iPhone');
                setConnected(true);
              }
            }, 10000);
            break;
          case 'closed':
            cleanup('Disconnected', 'Please connect from your iOS device');
            break;
        }
      };

      return conn;
    }

    async function handleOffer(sdpStr) {
      remoteDescSet     = false;
      pendingCandidates = [];
      cleanup(null, null, true);
      setStatus('Connecting…', 'Establishing WebRTC session');
      setConnected(true);

      pc = buildPeerConnection();

      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: sdpStr });
        remoteDescSet = true;
        console.log('[BDcast] remote description set, flushing', pendingCandidates.length, 'buffered ICE candidates');

        for (const c of pendingCandidates) {
          try { await pc.addIceCandidate(c); } catch (_) {}
        }
        pendingCandidates = [];

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        console.log('[BDcast] answer created, sending back to iOS');

        context.sendCustomMessage(NS, senderId, {
          type: 'answer',
          sdp:  pc.localDescription.sdp,
        });
      } catch (err) {
        console.error('[BDcast] offer handling error:', err);
        cleanup('Connection failed', err.message);
        setConnected(true);
      }
    }

    async function handleICE(msg) {
      const candidate = {
        candidate:     msg.candidate,
        sdpMid:        msg.sdpMid,
        sdpMLineIndex: msg.sdpMLineIndex,
      };

      if (!pc || !remoteDescSet) {
        pendingCandidates.push(candidate);
        return;
      }

      try {
        await pc.addIceCandidate(candidate);
      } catch (e) {
        console.warn('[BDcast] addIceCandidate error (benign):', e.message);
      }
    }

    function cleanup(title, sub, keepOverlay = false) {
      try {
        if (playerManager) {
          playerManager.stop();
        }
      } catch (e) {
        console.warn('[BDcast] playerManager.stop() error:', e);
      }

      if (pc) { pc.close(); pc = null; }
      remoteDescSet     = false;
      pendingCandidates = [];
      video.srcObject   = null;
      if (!keepOverlay) {
        showStream(false);
        setConnected(false);
      }
      if (title !== null) setStatus(title, sub);
    }


  </script>
</body>
</html>
